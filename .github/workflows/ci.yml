name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

  claude-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download modules before offline comparison
        env:
          GOMODCACHE: ${{ runner.temp }}/claude-compat-modules
          GOENV: "off"
          GOTOOLCHAIN: local
          GOWORK: "off"
          GOFLAGS: -mod=readonly
        run: go mod download

      - name: Test driver and compare all three lanes
        env:
          GOMODCACHE: ${{ runner.temp }}/claude-compat-modules
          BASELINE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          evidence = Path(os.environ["RUNNER_TEMP"]) / "claude-compat"
          evidence.mkdir(mode=0o700)
          repo = Path(os.environ["GITHUB_WORKSPACE"])

          def run_logged(args, name):
              with (evidence / name).open("x") as log:
                  subprocess.run(args, cwd=repo, stdout=log,
                                 stderr=subprocess.STDOUT, check=True)

          def git(*args):
              return subprocess.run(
                  ["git", "--no-pager", "--no-replace-objects", *args],
                  cwd=repo, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                  text=True, check=True,
              ).stdout.strip()

          try:
              run_logged([sys.executable, "-B", "-m", "unittest", "discover",
                          "-s", "scripts", "-p", "test_claude_compat.py", "-v"],
                         "unit-tests.log")
              baseline = os.environ["BASELINE_SHA"]
              if not re.fullmatch(r"[0-9a-f]{40}", baseline) or baseline == "0" * 40:
                  raise ValueError("Event baseline must be a nonzero full commit SHA")
              resolved = git("rev-parse", "--verify", baseline + "^{commit}")
              if resolved != baseline:
                  raise ValueError("Event baseline did not resolve to the exact commit")
              candidate = git("rev-parse", "--verify", "HEAD^{commit}")
              main = git("rev-parse", "--verify", "refs/remotes/origin/main^{commit}")
              git("merge-base", "--is-ancestor", baseline, main)
              (evidence / "event-revisions.json").write_text(json.dumps({
                  "baseline": baseline, "candidate": candidate, "origin_main": main,
              }, indent=2) + "\n")
              output = evidence / "comparison"
              run_logged([sys.executable, "-B", "scripts/claude-compat.py",
                          "--run", "--baseline", baseline, "--candidate", candidate,
                          "--output", str(output)], "driver.log")
              result = json.loads((output / "result.json").read_text())
              if (result.get("compatibility_pass") is not True
                      or result.get("status") != "captures-compared"
                      or result.get("revisions") != {"main": baseline, "candidate": candidate}
                      or result.get("origin_main") != main
                      or set(result.get("lanes", {})) != {
                          "main-default", "candidate-default", "candidate-explicit"}):
                  raise ValueError("Missing passing three-lane result for frozen event revisions")
          except Exception as error:
              (evidence / "failure.json").write_text(json.dumps({
                  "status": "failed", "error": str(error),
              }, indent=2) + "\n")
              raise

      - name: Upload compatibility evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-compat-evidence
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/claude-compat/*.json
            ${{ runner.temp }}/claude-compat/*.log
            ${{ runner.temp }}/claude-compat/comparison/*.json
            ${{ runner.temp }}/claude-compat/comparison/*.jsonl
            ${{ runner.temp }}/claude-compat/comparison/main-default/*.json
            ${{ runner.temp }}/claude-compat/comparison/main-default/*.log
            ${{ runner.temp }}/claude-compat/comparison/candidate-default/*.json
            ${{ runner.temp }}/claude-compat/comparison/candidate-default/*.log
            ${{ runner.temp }}/claude-compat/comparison/candidate-explicit/*.json
            ${{ runner.temp }}/claude-compat/comparison/candidate-explicit/*.log
