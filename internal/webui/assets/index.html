<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <title>Factory · Local control room</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
  <script src="/bootstrap.js"></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#" data-nav="overview" aria-label="Factory overview"><span class="brand-mark" aria-hidden="true">F</span><span>Factory<span class="brand-sub">LOCAL CONTROL ROOM</span></span></a>
      <div class="workspace-label">WORKSPACE</div>
      <nav aria-label="Main navigation">
        <button class="nav-item active" data-nav="overview"><span aria-hidden="true">◈</span> Overview</button>
        <button class="nav-item" data-nav="jobs"><span aria-hidden="true">▤</span> Jobs <span id="job-nav-count" class="nav-count">—</span></button>
        <button class="nav-item" data-nav="health"><span aria-hidden="true">⊙</span> Settings & health</button>
      </nav>
      <div class="sidebar-bottom"><div class="instance-dot"></div><div>Local instance<small id="sidebar-instance">Connecting…</small></div></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="breadcrumb">Workspace <span>/</span> <strong id="breadcrumb">Overview</strong></div><div class="topbar-right"><span class="local-pill">● LOCAL ONLY</span><button class="primary compact" id="new-job">＋ New job</button></div></header>
      <div id="connection" class="connection" role="status" hidden></div>
      <main id="main" tabindex="-1"><div class="loading-state"><span class="loading-dot"></span> Connecting to your factory…</div></main>
      <footer><span>Factory runs independently of this browser.</span><span id="last-refresh">Waiting for an observation</span></footer>
    </div>
  </div>
  <section id="receipts" class="receipts" aria-label="Action receipts" aria-live="polite"></section>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-body"></div></dialog>
</body>
</html>
